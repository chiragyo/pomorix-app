<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Pomorix</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&amp;display=swap">
  <!-- Styles are inline: GitHub Pages serves this page at any missing path, so relative links would break. -->
  <style>
    :root { --bg:#f6f9f7; --ink:#10261e; --muted:#4b5f57; --brand:#3f8e6d; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b1411; --ink:#e8f1ec; --muted:#a6b8b0; --brand:#4caf7d; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; text-align:center;
      font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
    img { width:96px; height:96px; border-radius:26px; margin:0 auto; display:block; box-shadow:0 18px 40px -16px rgba(16,60,44,.45); }
    .code { margin-top:28px; font-size:.8rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--brand); }
    h1 { margin:10px 0 0; font-size:clamp(2rem,6vw,3rem); letter-spacing:-.04em; line-height:1.1; }
    p { margin:14px auto 0; max-width:28rem; color:var(--muted); line-height:1.6; }
    a.btn { display:inline-block; margin-top:28px; padding:13px 24px; border-radius:999px; background:var(--brand); color:#fff; font-weight:700; text-decoration:none; }
    a.btn-alt { margin-left:8px; background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1px rgba(127,127,127,.35); }
    a.btn:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/icons/pomorix-logo-256.png" alt="Pomorix" width="96" height="96">
    <p class="code">Error 404</p>
    <h1>This page took a break.</h1>
    <p>We couldn't find the page you were looking for. Let's get you back to focusing.</p>
    <a class="btn" href="/">Back to Pomorix</a>
    <a class="btn btn-alt" href="/blog/">Read the blog</a>
  </main>
</body>
</html>
